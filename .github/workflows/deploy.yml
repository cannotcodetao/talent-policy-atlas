name: Build & Publish talent-policy

# ────────────────────────────────────────────────────────────────
# 子站 talent-policy：Python 构建出单文件自包含 HTML。
# 产物文件名 人才引进政策_2026.html -> 线上重命名为 index.html
#
# 【2026-11-04 架构调整】部署不再由 Actions SSH 进服务器完成，改为：
#   Actions 构建 → 推 dist 分支（用内置 GITHUB_TOKEN）→ 服务器 site-pull 拉取 dist
# 好处：仓库不需要 SERVER_HOST / SSH_PRIVATE_KEY 任何 Secret，新建仓库零配置。
# 服务器侧逻辑见 my-sites/server/site-pull.sh（/www/bin/site-pull.sh）。
# ────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-talent-policy
  cancel-in-progress: false

# 推 dist 分支需要写权限；这是 GitHub 自动提供的令牌，不需要人工配置 Secret
permissions:
  contents: write

env:
  SITE_NAME: talent-policy
  SOURCE_HTML: 人才引进政策_2026.html

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build
        run: |
          set -e
          # _build_html.py 只用标准库（json / os / sys / re），无需 pip 安装
          python _build_html.py

          test -f "$SOURCE_HTML" || { echo "❌ 构建产物 $SOURCE_HTML 不存在"; exit 1; }

          rm -rf _release && mkdir -p _release
          cp "$SOURCE_HTML" _release/index.html

          # ── 产物验收 ───────────────────────────────────────────
          test -s _release/index.html || { echo "❌ index.html 为空"; exit 1; }

          # 自包含：不允许任何外部 script/link 引用（否则子系统依赖会断）
          if grep -qE '<(script|link)[^>]+(src|href)="https?://' _release/index.html; then
            echo "❌ 产物含外部资源引用，自包含校验失败"
            grep -oE '<(script|link)[^>]+(src|href)="https?://[^"]*"' _release/index.html | head
            exit 1
          fi

          # 自包含单文件：不该有静态 img 标签
          if grep -q '<img' _release/index.html; then
            echo "⚠️ 产物含 <img> 标签，请确认图片已内联或同目录提供"
          fi

          SIZE=$(stat -c%s _release/index.html)
          echo "✅ 构建验收通过：${SIZE} bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "❌ 产物体积异常（预期约 1.5MB），可能构建不完整"
            exit 1
          fi

      # ── 产物推到 dist 分支，供服务器 site-pull 拉取 ──────────────
      # GITHUB_TOKEN 是 Actions 内置令牌，无需任何人工 Secret。
      # 用 -f 强推：dist 是纯生成物，不需要历史。
      - name: Publish to dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd _release
          git init -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dist: ${GITHUB_SHA::7} · run ${GITHUB_RUN_NUMBER}"
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:dist
          echo "✅ 已推送 dist 分支：$(git rev-parse --short HEAD)"
          echo "   服务器将在下一次轮询（≤2 分钟）内拉取并发布"
